name: Increment patch version

on:
  push:
    branches:
      - main
    paths:
      - 'rastertoolkit/**'
      - 'pyproject.toml'

  # Allows manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Allow writing to the repository (e.g., commits, pushes)

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Configure Git
        run: |
          git config --global user.name "IDM Tools"
          git config --global user.email "idmtools@idmod.org"
      - name: Bump version
        uses: callowayproject/bump-my-version@master
        with:
          args: patch -vv --dry-run
